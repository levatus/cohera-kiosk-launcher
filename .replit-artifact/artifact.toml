kind = "mobile"
previewPath = "/kiosk-launcher/"
title = "Z - Kiosk Launcher"
version = "1.0.0"
id = "artifacts/kiosk-launcher"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/kiosk-launcher/" ]
localPort = 21902
autoStart = false

[services.development]
run = "pnpm --filter @workspace/kiosk-launcher run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kiosk-launcher", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kiosk-launcher", "run", "serve" ]

[services.env]
PORT = "21902"
BASE_PATH = "/kiosk-launcher/"
