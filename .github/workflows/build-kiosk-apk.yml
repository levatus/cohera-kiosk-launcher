name: Build Kiosk APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project
        run: eas init --non-interactive --force
        continue-on-error: true
      - name: Build APK
        run: eas build --platform android --profile production --non-interactive
      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_JSON=$(eas build:list --platform android --limit 1 --json --non-interactive 2>/dev/null || echo "[]")
          APK_URL=$(echo "$BUILD_JSON" | node -e "
            try {
              const a = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              if (a[0]?.artifacts?.buildUrl) console.log(a[0].artifacts.buildUrl);
            } catch(e) {}
          ")
          VERSION_CODE=$(node -e "const a=require('./app.json');console.log(a.expo.android.versionCode)")
          if [ -n "$APK_URL" ]; then
            curl -L -o kiosk-update.apk "$APK_URL"
            TAG="build-$VERSION_CODE"
            gh release delete "$TAG" --yes 2>/dev/null || true
            gh release create "$TAG" kiosk-update.apk \
              --title "Kiosk APK build $VERSION_CODE" \
              --notes "Auto-built from commit ${{ github.sha }}" \
              --latest
            echo "Published to GitHub Releases: $TAG"
          else
            echo "No APK URL found, skipping release"
          fi
  eas-update:
    name: Push EAS OTA Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project
        run: eas init --non-interactive --force
        continue-on-error: true
      - name: Push OTA update
        run: eas update --branch production --message "Auto-update from ${{ github.sha }}" --non-interactive
