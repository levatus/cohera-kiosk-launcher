name: Build Kiosk APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    name: Build Android APK (local)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Auto-increment versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -c "
          import json, os
          app = json.load(open('app.json'))
          vc = int(os.environ['RUN_NUMBER'])
          app['expo']['android']['versionCode'] = vc
          json.dump(app, open('app.json','w'), indent=2)
          print('versionCode set to', vc)
          "
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project
        run: eas init --non-interactive --force
        continue-on-error: true
      - name: Build APK on GitHub runner (no Expo cloud slot)
        run: eas build --platform android --profile production --non-interactive --local --output ./kiosk-update.apk
      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=${{ github.run_number }}
          TAG="build-${VERSION_CODE}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" kiosk-update.apk \
            --title "Kiosk APK build ${VERSION_CODE}" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --latest
          echo "Published: $TAG"
  eas-update:
    name: Push EAS OTA Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project
        run: eas init --non-interactive --force
        continue-on-error: true
      - name: Push OTA update
        run: eas update --branch production --message "Auto-update from ${{ github.sha }}" --non-interactive
