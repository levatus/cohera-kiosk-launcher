name: Build Kiosk APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Auto-increment versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -c "
          import json, os
          app = json.load(open('app.json'))
          vc = int(os.environ['RUN_NUMBER'])
          app['expo']['android']['versionCode'] = vc
          json.dump(app, open('app.json','w'), indent=2)
          print('versionCode set to', vc)
          "
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project
        run: eas init --non-interactive --force
        continue-on-error: true
      - name: Build APK via Expo cloud
        id: eas_build
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --json --no-wait)
          BUILD_ID=$(echo "$BUILD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Waiting for build $BUILD_ID..."
          eas build:view "$BUILD_ID" --json > /dev/null
          while true; do
            STATUS=$(eas build:view "$BUILD_ID" --json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "Status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then break; fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then exit 1; fi
            sleep 30
          done
          APK_URL=$(eas build:view "$BUILD_ID" --json | python3 -c "import sys,json; print(json.load(sys.stdin)['artifacts']['buildUrl'])")
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
      - name: Download APK and publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L "${{ steps.eas_build.outputs.apk_url }}" -o kiosk-update.apk
          TAG="build-${{ github.run_number }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" kiosk-update.apk \
            --title "Kiosk APK build ${{ github.run_number }}" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --latest
          echo "Published: $TAG"
  eas-update:
    name: Push EAS OTA Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link EAS project
        run: eas init --non-interactive --force
        continue-on-error: true
      - name: Push OTA update
        run: eas update --branch production --message "Auto-update from ${{ github.sha }}" --non-interactive
